<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Bridge | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Outfit:wght@400;700&display=swap');
        :root { --primary: #6366f1; --bg-dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: #f8fafc; overflow-x: hidden; }
        h2, .nav-logo { font-family: 'Outfit', sans-serif; }
        
        .glass-nav { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        .nav-link { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #94a3b8; transition: all 0.3s ease; position: relative; }
        .nav-link:hover { color: #ffffff; }
        .nav-link.active { color: #818cf8; }
        .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #6366f1; transition: width 0.3s; }
        .nav-link:hover::after { width: 100%; }

        .card-dark { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); }
        
        input, textarea { 
            background: rgba(30, 41, 59, 0.3) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: white !important; 
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus { border-color: #6366f1 !important; outline: none; }

        .gradient-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        
        .btn-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body>
    <header class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-12">
                <a href="index.html" class="flex items-center space-x-3 nav-logo group">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 group-hover:rotate-12 transition-transform">
                        <i class="fa-solid fa-bridge"></i>
                    </div>
                    <span class="text-xl font-800 uppercase tracking-tight">Impact <span class="text-indigo-400">Bridge</span></span>
                </a>
                <nav class="hidden lg:flex items-center space-x-8">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="opportunities.html" class="nav-link">Opportunities</a>
                    <a href="about.html" class="nav-link">About</a>
                    <a href="contact.html" class="nav-link active">Contact</a>
                </nav>
            </div>
            <div class="flex items-center space-x-4">
                <a href="opportunities.html" class="hidden sm:block bg-indigo-600 px-6 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider text-white shadow-lg shadow-indigo-500/20 hover:scale-105 active:scale-95 transition">Get Started</a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-16 md:py-24">
        <div class="card-dark rounded-[3rem] overflow-hidden shadow-2xl">
            <!-- Gradient Header Section with Descriptive Details -->
            <div class="gradient-header p-10 md:p-16 text-center">
                <h2 class="text-4xl md:text-5xl font-800 text-white mb-6 tracking-tighter">Get in Touch</h2>
                <div class="space-y-4 text-indigo-100">
                    <p class="text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-phone mr-2"></i> Call: +91 93108 55437</p>
                    <p class="text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-envelope mr-2"></i> Email: bridge@impact.org</p>
                    <p class="text-xs opacity-80 max-w-md mx-auto leading-relaxed">Our support team is available 24/7 to assist with mission inquiries and volunteer registration across India.</p>
                </div>
            </div>
            
            <!-- Form Section -->
            <div class="p-8 md:p-16 bg-slate-900/20">
                <form class="space-y-8">
                    <div class="space-y-3">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1">Full Name</label>
                        <input type="text" required class="w-full px-6 py-4 rounded-2xl outline-none" placeholder="Enter your full name">
                    </div>

                    <div class="space-y-3">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1">How can we help?</label>
                        <textarea rows="4" required class="w-full px-6 py-4 rounded-2xl outline-none resize-none" placeholder="Write your message here..."></textarea>
                    </div>

                    <button type="submit" class="w-full py-5 btn-gradient text-white rounded-2xl font-800 uppercase tracking-widest text-xs shadow-xl shadow-indigo-500/20 hover:brightness-110 hover:-translate-y-1 transition-all active:scale-[0.98]">
                        Send Message
                    </button>
                </form>

                <!-- Social Logos Section -->
                <div class="mt-12 pt-8 border-t border-slate-800/50 flex flex-col items-center">
                    <p class="text-[9px] font-black text-slate-600 uppercase tracking-[0.3em] mb-6">Join our community</p>
                    <div class="flex space-x-8 text-2xl">
                        <a href="#" class="text-slate-500 hover:text-[#1877F2] transition-colors duration-300">
                            <i class="fa-brands fa-facebook"></i>
                        </a>
                        <a href="#" class="text-slate-500 hover:text-[#E4405F] transition-colors duration-300">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                        <a href="#" class="text-slate-500 hover:text-[#1DA1F2] transition-colors duration-300">
                            <i class="fa-brands fa-x-twitter"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-slate-900 text-center">
        <p class="text-slate-600 text-[10px] tracking-widest font-bold uppercase">&copy; 2026 Impact Bridge. Engineering Solidarity.</p>
    </footer>
</body>
</html>
