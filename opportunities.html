<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Bridge | Opportunities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Outfit:wght@400;700&display=swap');
        :root { --primary: #6366f1; --bg-dark: #020617; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: #f8fafc; overflow-x: hidden; }
        h2, .nav-logo { font-family: 'Outfit', sans-serif; }
        
        .glass-nav { background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Unified Navigation styling */
        .nav-link { position: relative; font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.3s ease; }
        .nav-link::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: #6366f1; transition: width 0.3s; }
        .nav-link:hover::after { width: 100%; }
        .nav-link.active { color: #818cf8; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .card-dark { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-dark:hover { transform: translateY(-12px); border-color: rgba(99, 102, 241, 0.5); box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body>
    <header class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 md:px-6 h-20 flex items-center justify-between">
            <!-- Logo Section -->
            <a href="index.html" class="flex items-center space-x-2 md:space-x-3 nav-logo group shrink-0">
                <div class="w-8 h-8 md:w-10 md:h-10 bg-indigo-600 rounded-lg md:rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 group-hover:rotate-12 transition-transform">
                    <i class="fa-solid fa-bridge text-sm md:text-base"></i>
                </div>
                <span class="text-base md:text-xl font-800 uppercase tracking-tight">Impact <span class="text-indigo-400">Bridge</span></span>
            </a>
            
            <!-- Universal Navigation -->
         <nav class="hidden lg:flex items-center space-x-8">
    <a href="index.html" class="nav-link">Home</a>
    <a href="opportunities.html" class="nav-link">Opportunities</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="faq.html" class="nav-link">FAQ</a>
    <a href="contact.html" class="nav-link">Contact</a>
</nav>

            <div class="hidden sm:flex items-center shrink-0">
                <a href="contact.html" class="bg-indigo-600 px-5 py-2 rounded-xl font-bold text-[10px] uppercase tracking-wider shadow-lg shadow-indigo-500/20 hover:scale-105 active:scale-95 transition">Partner With Us</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <div class="text-center mb-20" data-aos="fade-down">
            <span class="text-indigo-400 text-[10px] font-black uppercase tracking-[0.3em] mb-4 block">Available Roles</span>
            <h2 class="text-4xl md:text-5xl font-800 text-white mb-4">Active Missions</h2>
            <p class="text-slate-400 max-w-xl mx-auto">Select a project where your professional skills can create the most significant impact.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="grid">
            <!-- Content Injected via JS -->
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });
        
        const missions = [
            { title: 'STEM Education Lead', cat: 'Education', loc: 'Delhi (Remote)', img: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&w=800' },
            { title: 'Rehabilitation Tech', cat: 'Medical', loc: 'Mumbai', img: 'https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=800' },
            { title: 'Conservation Officer', cat: 'Eco', loc: 'Kerala', img: 'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=800' },
            { title: 'UI/UX for Social Good', cat: 'Digital', loc: 'Global', img: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800' },
            { title: 'Disaster Relief Lead', cat: 'Emergency', loc: 'Assam', img: 'https://images.unsplash.com/photo-1594122230689-45899d9e6f69?auto=format&fit=crop&w=800' },
            { title: 'Animal Welfare Aid', cat: 'Social', loc: 'Bangalore', img: 'https://images.unsplash.com/photo-1450778869180-41d0601e046e?auto=format&fit=crop&w=800' }
        ];

        document.getElementById('grid').innerHTML = missions.map((m, i) => `
            <div class="card-dark rounded-[2.5rem] overflow-hidden group" data-aos="fade-up" data-aos-delay="${i * 100}">
                <div class="h-60 relative overflow-hidden">
                    <img src="${m.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 to-transparent"></div>
                    <span class="absolute top-5 left-5 bg-indigo-600 text-[10px] font-black px-4 py-1.5 rounded-lg uppercase tracking-tighter text-white">${m.cat}</span>
                </div>
                <div class="p-10">
                    <h3 class="text-2xl font-bold text-white mb-2">${m.title}</h3>
                    <p class="text-slate-500 text-sm font-medium mb-8"><i class="fa-solid fa-location-dot mr-2 text-indigo-400"></i>${m.loc}</p>
                    <a href="register.html?mission=${encodeURIComponent(m.title)}" class="block w-full text-center py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-500 transition-all shadow-xl shadow-indigo-500/10 active:scale-95">Apply Now</a>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
